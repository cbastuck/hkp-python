[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hkp-python"
version = "1.0.0"
description = "Python Readymade runtime server — an asyncio HKP runtime hosting services over REST."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "cbastuck", email = "mail@cbastuck.de" }]
keywords = ["hkp", "readymade", "runtime", "aiohttp", "asyncio", "dataflow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-cors>=0.7",
    "PyJWT[crypto]>=2.8",
]

[project.urls]
Homepage = "https://readymadeit.com"
Repository = "https://github.com/cbastuck/hkp-python"
Issues = "https://github.com/cbastuck/hkp-python/issues"

[project.scripts]
hkp-python = "hkp.__main__:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "numpy>=1.26",
]
asr = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
]
tts = [
    "kokoro-onnx>=0.4",
    "numpy>=1.26",
]
llm = [
    "llama-cpp-python>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hkp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
