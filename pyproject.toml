[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hkp-python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-cors>=0.7",
    "PyJWT[crypto]>=2.8",
]

[project.scripts]
hkp-python = "hkp.__main__:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "numpy>=1.26",
]
asr = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
]
tts = [
    "kokoro-onnx>=0.4",
    "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hkp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
